<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FZ.ADS | Especialista en Google & Meta Ads</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="hero">
    <div class="hero-content">
      <h1>Especialista en<br><span>Google & Meta Ads</span></h1>
      <p>Transformamos clics en clientes reales todos los días.</p>
    </div>
  </section>

  <section class="form-section">
    <h2>Solicitá tu Cotización</h2>
    <p>Completá el formulario y recibí tu asesoría personalizada por WhatsApp.</p>

    <form id="leadForm" class="form-card">
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" id="nombre" placeholder="Tu nombre" required>
      </div>

      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="correo" placeholder="tucorreo@gmail.com" required>
      </div>

      <div class="form-group">
        <label>Tipo de proyecto</label>
        <select id="proyecto" required>
          <option value="">Selecciona una opción</option>
          <option>E-commerce</option>
          <option>Estética</option>
          <option>Clínica</option>
          <option>Médico</option>
          <option>Asesoría únicamente</option>
          <option>Otro</option>
        </select>
      </div>

      <div class="form-group">
        <label>Plataforma</label>
        <select id="plataforma" required>
          <option value="">Selecciona una opción</option>
          <option>Google Ads</option>
          <option>Meta Ads</option>
          <option>Ambas</option>
        </select>
      </div>

      <div class="form-group">
        <label>Presupuesto mensual</label>
        <select id="presupuesto" required>
          <option value="">Selecciona un rango</option>
          <option>USD 600 – 1.000</option>
          <option>USD 1.000 – 3.000</option>
          <option>Más de USD 3.000</option>
        </select>
      </div>

      <div class="form-group">
        <label>Breve descripción del proyecto</label>
        <textarea id="descripcion" placeholder="Contanos brevemente qué necesitás (mínimo 30 caracteres)..." minlength="30" required></textarea>
      </div>

      <button type="submit" class="btn-gradiente">
        Generar Cotización por WhatsApp
      </button>
    </form>
  </section>

  <script src="script.js"></script>
</body>
</html>
